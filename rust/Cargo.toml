[package]
name = "boxmaid"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Mermaid diagrams for the terminal: flowcharts, sequence, class, state, ER, gantt and more, drawn with box characters"
repository = "https://github.com/boxmaid/boxmaid"
homepage = "https://github.com/boxmaid/boxmaid"
documentation = "https://docs.rs/boxmaid"
readme = "README.md"
keywords = ["mermaid", "diagram", "terminal", "tui", "ascii"]
categories = ["command-line-utilities", "visualization", "text-processing"]
exclude = ["tests/"]

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
ratatui = { version = "0.29", optional = true, default-features = false }

[features]
default = []
# A ratatui widget for diagrams.
ratatui = ["dep:ratatui"]

[[bin]]
name = "boxmaid"
path = "src/bin/boxmaid.rs"

[[example]]
name = "ratatui_viewer"
required-features = ["ratatui"]
