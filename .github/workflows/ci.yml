name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: tui/go.sum
      - run: go vet ./... ./tui/...
      - run: go test -race ./... ./tui/...

  go-minimum:
    name: Go core / minimum version
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: false
      - run: go test ./...

  go-tui-minimum:
    name: Go workspace / minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache-dependency-path: tui/go.sum
      - run: go test ./... ./tui/...

  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: rust
      - run: cargo test --locked --all-features
        working-directory: rust
      - run: cargo package --locked
        working-directory: rust

  rust-minimum:
    name: Rust / minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo test --locked --all-features
        working-directory: rust

  contracts:
    name: Output parity, generated assets, formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: tui/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Check golden files
        run: |
          go test -run Golden -update
          git diff --exit-code -- testdata/
      - run: go run ./internal/artwork -check
      - run: go build -o "${{ runner.temp }}/boxmaid-go" ./cmd/boxmaid
      - run: cargo build --locked --manifest-path rust/Cargo.toml
      - run: python3 scripts/check-parity.py --go "${{ runner.temp }}/boxmaid-go" --rust rust/target/debug/boxmaid
