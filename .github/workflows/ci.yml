name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./... ./tui/...
      - run: go test ./...
      - run: cd tui && go test ./...
      - name: Goldens are up to date
        run: |
          go test -run Golden -update
          git diff --exit-code testdata/

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests (shared goldens, byte for byte)
        run: cargo test --all-features

  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82
      - run: cargo test

  parity:
    name: Go and Rust CLIs agree
    runs-on: ubuntu-latest
    needs: [go, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: go build -o /tmp/bm-go ./cmd/boxmaid
      - run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Compare at several widths
        run: |
          fail=0
          for f in testdata/cases/*.mmd; do
            for w in 120 60 30; do
              for a in "" "-ascii"; do
                g=$(/tmp/bm-go -w $w $a -color never "$f" 2>&1)
                r=$(rust/target/release/boxmaid -w $w $a -color never "$f" 2>&1)
                if [ "$g" != "$r" ]; then echo "differs: $f -w $w $a"; fail=1; fi
              done
            done
          done
          exit $fail
